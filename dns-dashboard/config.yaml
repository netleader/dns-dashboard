name: DNS-Dashboard
version: "0.1.0"
slug: dns_dashboard
url: https://github.com/netleader/dns-dashboard
description: Ein Dashboard für zwei AdGuard-Home-Server – Status, Statistiken, Query-Log, Sync und Aktionen.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-check
panel_title: DNS
panel_admin: true
# Einzelne Anfragen (groß, nur wenige Tage) gehören nicht in Backups; die stündliche Historie schon.
backup_exclude:
  - "raw.db*"
options:
  servers:
    - name: "DNS1 · Pi"
      url: "http://192.168.10.11:8083"
      username: ""
      password: ""
    - name: "DNS2 · HA"
      url: "http://192.168.10.10:8083"
      username: ""
      password: ""
  sync_url: "http://192.168.10.11:8080"
  sync_username: ""
  sync_password: ""
  origin: auto
  poll_interval: 10
  querylog_poll_interval: 5
  history_raw_days: 7
  history_hourly_days: 365
  dns_probe_domain: example.com
  dns_probe_interval: 60
schema:
  servers:
    - name: str
      url: url
      username: str?
      password: password?
      color: str?
      dns_address: str?
  sync_url: str?
  sync_username: str?
  sync_password: password?
  origin: list(auto|dns1|dns2)
  poll_interval: int(3,300)
  querylog_poll_interval: int(2,300)
  history_raw_days: int(1,90)
  history_hourly_days: int(7,1825)
  dns_probe_domain: str
  dns_probe_interval: int(10,3600)
