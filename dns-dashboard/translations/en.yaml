configuration:
  servers:
    name: AdGuard Home servers
    description: >-
      List of servers (name, web UI URL incl. port, username, password).
      Optional: color (hex) and dns_address (IP[:port] for the DNS probe; defaults to the URL's host).
  sync_url:
    name: AdGuard Home Sync URL
    description: Sync API address, e.g. http://192.168.10.11:8080. Leave empty if you don't use sync.
  sync_username:
    name: AdGuard Home Sync username
  sync_password:
    name: AdGuard Home Sync password
  origin:
    name: Origin server
    description: Server that receives custom rules. "auto" uses the origin reported by AdGuard Home Sync.
  poll_interval:
    name: Poll interval (seconds)
  querylog_poll_interval:
    name: Query log interval (seconds)
  history_raw_days:
    name: Keep individual queries (days)
  history_hourly_days:
    name: Keep hourly history (days)
  dns_probe_domain:
    name: DNS probe domain
  dns_probe_interval:
    name: DNS probe interval (seconds)
